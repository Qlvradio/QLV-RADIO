<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>La mia Web Radio</title>
<style>
  :root { --bg:#fff; --fg:#1a1a1a; --accent:#d9480f; --muted:#666; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121212; --fg:#f2f2f2; --muted:#aaa; } }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--fg); text-align:center; padding:24px 16px; }
  h1 { margin:0 0 4px; }
  #ora { color:var(--muted); min-height:1.4em; margin-bottom:20px; }
  button { font-size:1.2rem; padding:16px 32px; border:0; border-radius:999px; background:var(--accent); color:#fff; }
  button:disabled { opacity:.5; }
  ul { list-style:none; padding:0; margin:24px auto 0; max-width:420px; text-align:left; }
  li { padding:10px 4px; border-bottom:1px solid #8884; }
  li.on { color:var(--accent); font-weight:700; }
</style>
</head>
<body>
<h1>📻 QLV RADIO</h1>
<div id="ora">Caricamento...</div>
<audio id="a"></audio>
<button id="play" disabled>▶ Ascolta la radio</button>
<ul id="lista"></ul>
<script>
// Tutti gli ascoltatori calcolano la posizione dall'orologio: stessa canzone, stesso momento.
var EPOCH = Date.UTC(2026, 0, 1) / 1000;
var a = document.getElementById('a'), ora = document.getElementById('ora');
var lista = document.getElementById('lista'), btn = document.getElementById('play');
var brani = [], durate = [], totale = 0, i = 0, attivo = false;

function durata(url) {
  return new Promise(function (ok) {
    var t = new Audio();
    t.preload = 'metadata';
    t.onloadedmetadata = function () { ok(t.duration); };
    t.onerror = function () { ok(0); };
    t.src = url;
  });
}
function mostra() {
  lista.innerHTML = '';
  brani.forEach(function (b, n) {
    var li = document.createElement('li');
    li.textContent = b.titolo;
    if (n === i) li.className = 'on';
    lista.appendChild(li);
  });
}
function posizione() {
  var s = (Date.now() / 1000 - EPOCH) % totale;
  for (var k = 0; k < brani.length; k++) {
    if (s < durate[k]) return { k: k, t: s };
    s -= durate[k];
  }
  return { k: 0, t: 0 };
}
function sincronizza() {
  var p = posizione();
  i = p.k;
  a.src = brani[i].file;
  a.onloadedmetadata = function () { a.currentTime = p.t; a.play().catch(function () {}); };
  ora.textContent = '▶ In onda: ' + brani[i].titolo;
  mostra();
}
a.onended = function () { if (attivo) sincronizza(); };

fetch('playlist.json?t=' + Date.now())
  .then(function (r) {
    if (!r.ok) throw new Error('playlist.json non trovato');
    return r.json();
  })
  .then(function (d) {
    ora.textContent = 'Preparo la radio...';
    return Promise.all(d.map(function (b) { return durata(b.file); })).then(function (dur) {
      d.forEach(function (b, n) {
        if (dur[n] > 0) { brani.push(b); durate.push(dur[n]); totale += dur[n]; }
        else { console.log('File non leggibile: ' + b.file); }
      });
      if (!brani.length) throw new Error('Nessun MP3 leggibile: controlla i nomi in playlist.json');
      ora.textContent = 'Pronta! Premi il pulsante.';
      btn.disabled = false;
      mostra();
    });
  })
  .catch(function (e) { ora.textContent = 'Errore: ' + e.message; });

btn.onclick = function () {
  if (!attivo) { attivo = true; sincronizza(); btn.textContent = '⏹ Stop'; }
  else { attivo = false; a.pause(); btn.textContent = '▶ Ascolta la radio'; ora.textContent = 'In pausa'; }
};
</script>
</body>
</html>
