<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0a2a6b">
<title>QLV RADIO</title>
<style>
  :root { --blu:#0a2a6b; --blu2:#123f9c; --giallo:#ffd100; }
  body { margin:0; min-height:100vh; font-family:system-ui,sans-serif; color:#fff; text-align:center;
         box-sizing:border-box; background:var(--blu); }
  header { background:var(--giallo); color:var(--blu); padding:36px 16px 28px; border-bottom:8px solid var(--blu2); }
  h1 { margin:0; font-size:2.4rem; letter-spacing:2px; }
  header p { margin:8px 0 0; font-weight:700; }
  main { padding:28px 16px; }
  #ora { min-height:1.4em; margin-bottom:24px; color:#dbe6ff; }
  button { font-size:1.2rem; font-weight:700; padding:16px 34px; border:0; border-radius:999px;
           background:var(--giallo); color:var(--blu); }
  button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
<h1>📻 QLV RADIO</h1>
<p>La radio dei Veronesi par i veneti</p>
</header>
<main>
<div id="ora">Caricamento...</div>
<audio id="a"></audio>
<button id="play" disabled>MÀCA QUA</button>
</main>
<script>
// Tutti calcolano la posizione dall'orologio: stessa traccia, stesso momento.
// Le canzoni cambiano ordine a ogni giro; dopo ogni 3 canzoni va in onda 1 spot (in ordine fisso).
var EPOCH = Date.UTC(2026, 9, 30) / 1000;
var OGNI = 3;
var a = document.getElementById('a'), ora = document.getElementById('ora');
var btn = document.getElementById('play');
var brani = [], durate = [], spot = [], durSpot = [], attivo = false;

function durata(url) {
  return new Promise(function (ok) {
    var t = new Audio();
    t.preload = 'metadata';
    t.onloadedmetadata = function () { ok(t.duration); };
    t.onerror = function () { ok(0); };
    t.src = url;
  });
}
function carica(file, lista, dur) {
  return fetch(file + '?t=' + Date.now())
    .then(function (r) { if (!r.ok) throw new Error(file + ' non trovato'); return r.json(); })
    .then(function (d) {
      return Promise.all(d.map(function (b) { return durata(b.file); })).then(function (ds) {
        d.forEach(function (b, n) { if (ds[n] > 0) { lista.push(b); dur.push(ds[n]); } });
      });
    });
}
function rnd(seed) {
  return function () {
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function mescola(L, prev) {
  var N = brani.length, ord = [], k, j, t;
  for (k = 0; k < N; k++) ord.push(k);
  var r = rnd(L + 12345);
  for (k = N - 1; k > 0; k--) { j = Math.floor(r() * (k + 1)); t = ord[k]; ord[k] = ord[j]; ord[j] = t; }
  if (N > 1 && ord[0] === prev) { t = ord[0]; ord[0] = ord[1]; ord[1] = t; }
  return ord;
}
function trova() {
  var s = Math.max(0, Date.now() / 1000 - EPOCH);
  var N = brani.length, M = spot.length, L = 0, prev = -1;
  while (true) {
    var ord = mescola(L, prev), seq = [];
    for (var j = 0; j < N; j++) {
      var c = ord[j];
      seq.push({ sp: false, idx: c, d: durate[c] });
      var n = L * N + j + 1;
      if (M && n % OGNI === 0) {
        var m = (n / OGNI - 1) % M;
        seq.push({ sp: true, idx: m, d: durSpot[m] });
      }
    }
    for (var k = 0; k < seq.length; k++) {
      if (s < seq[k].d) return { sp: seq[k].sp, idx: seq[k].idx, t: s };
      s -= seq[k].d;
    }
    prev = ord[N - 1]; L++;
  }
}
function sincronizza() {
  var p = trova();
  var el = p.sp ? spot[p.idx] : brani[p.idx];
  a.src = el.file;
  a.onloadedmetadata = function () { a.currentTime = p.t; a.play().catch(function () {}); };
  ora.textContent = p.sp ? '📢 Pubblicità' : '▶ In onda: ' + el.titolo;
}
a.onended = function () { if (attivo) sincronizza(); };

ora.textContent = 'Preparo la radio...';
carica('playlist.json', brani, durate)
  .then(function () {
    if (!brani.length) throw new Error('Nessun MP3 leggibile: controlla i nomi in playlist.json');
    return carica('pubblicita.json', spot, durSpot).catch(function () {});
  })
  .then(function () {
    ora.textContent = 'Pronta! Premi MÀCA QUA';
    btn.disabled = false;
  })
  .catch(function (e) { ora.textContent = 'Errore: ' + e.message; });

btn.onclick = function () {
  if (!attivo) { attivo = true; sincronizza(); btn.textContent = '⏹ STOP'; }
  else { attivo = false; a.pause(); btn.textContent = 'MÀCA QUA'; ora.textContent = 'In pausa'; }
};
</script>
</body>
</html>
